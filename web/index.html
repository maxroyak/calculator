<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="calculator">
        <div class="display" id="display" aria-live="polite">0</div>
        <div class="button-grid">
            <button class="btn btn-clear" data-action="clear" aria-label="Clear">C</button>
            <button class="btn btn-op" data-action="op" data-op="divide" aria-label="Divide">÷</button>
            <button class="btn btn-op" data-action="op" data-op="multiply" aria-label="Multiply">×</button>
            <button class="btn btn-op" data-action="op" data-op="subtract" aria-label="Subtract">−</button>

            <button class="btn btn-digit" data-action="digit" data-digit="7">7</button>
            <button class="btn btn-digit" data-action="digit" data-digit="8">8</button>
            <button class="btn btn-digit" data-action="digit" data-digit="9">9</button>
            <button class="btn btn-op btn-plus" data-action="op" data-op="add" aria-label="Add">+</button>

            <button class="btn btn-digit" data-action="digit" data-digit="4">4</button>
            <button class="btn btn-digit" data-action="digit" data-digit="5">5</button>
            <button class="btn btn-digit" data-action="digit" data-digit="6">6</button>

            <button class="btn btn-digit" data-action="digit" data-digit="1">1</button>
            <button class="btn btn-digit" data-action="digit" data-digit="2">2</button>
            <button class="btn btn-digit" data-action="digit" data-digit="3">3</button>
            <button class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>

            <button class="btn btn-digit btn-zero" data-action="digit" data-digit="0">0</button>
            <button class="btn btn-digit" data-action="digit" data-digit=".">.</button>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
